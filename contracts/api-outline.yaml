openapi: 3.1.0
info:
  title: MIA Private API
  version: 0.1.0
  description: Draft contract; authentication and authorization schemes must be completed before production.
paths:
  /health:
    get:
      summary: Service health without sensitive diagnostics
      responses:
        '200':
          description: Healthy
  /api/v1/meetings:
    post:
      summary: Create meeting metadata
      responses:
        '201':
          description: Meeting created
  /api/v1/meetings/{meeting_id}/recordings:
    post:
      summary: Register an iPhone-originated recording or imported file
      responses:
        '201':
          description: Recording registered
  /api/v1/meetings/{meeting_id}/transcript:
    get:
      summary: Retrieve transcript
      responses:
        '200':
          description: Transcript
  /api/v1/meetings/{meeting_id}/analyze:
    post:
      summary: Start local analysis
      responses:
        '202':
          description: Analysis queued
  /api/v1/meetings/{meeting_id}/approve:
    post:
      summary: Approve draft minutes
      responses:
        '200':
          description: Minutes approved
  /api/v1/meetings/{meeting_id}/audio:
    delete:
      summary: Request audio deletion
      responses:
        '202':
          description: Deletion queued and tracked
